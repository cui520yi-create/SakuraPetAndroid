<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小橘桌宠 · 原型</title>
<style>
  :root{
    --bg1:#1b2233; --bg2:#2a3350; --card:rgba(255,255,255,.08);
    --text:#f2f4f8; --sub:#aab3c8; --accent:#ffb454; --good:#7bd88f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(120% 120% at 30% 20%,var(--bg2),var(--bg1));
    color:var(--text);user-select:none;
  }
  /* 顶部状态面板 */
  .panel{
    position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;
    display:flex;flex-direction:column;gap:10px;z-index:20;
  }
  .title{font-size:16px;font-weight:700;letter-spacing:.5px;}
  .title span{color:var(--accent);}
  .bars{display:flex;gap:10px;}
  .bar{flex:1;background:var(--card);border-radius:12px;padding:8px 10px;}
  .bar .label{font-size:11px;color:var(sub);display:flex;justify-content:space-between;margin-bottom:5px;}
  .bar .track{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;}
  .bar .fill{height:100%;border-radius:6px;transition:width .3s ease;}
  #moodFill{background:var(--good);}
  #foodFill{background:var(--accent);}
  /* 气泡对话 */
  .bubble{
    position:fixed;left:50%;transform:translateX(-50%);bottom:120px;z-index:15;
    background:#fff;color:#222;padding:8px 14px;border-radius:16px;font-size:14px;
    opacity:0;transition:opacity .25s;max-width:70%;text-align:center;
  }
  .bubble.show{opacity:1;}
  /* 桌宠 */
  #pet{
    position:fixed;width:120px;height:120px;z-index:10;touch-action:none;
    left:50%;top:55%;transform:translate(-50%,-50%);
    cursor:grab;
  }
  #pet img{width:100%;height:100%;object-fit:contain;pointer-events:none;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.35));}
  #pet.dragging{cursor:grabbing;}
  #pet.bounce img{animation:bounce .5s ease;}
  @keyframes bounce{
    0%{transform:scale(1);}30%{transform:scale(1.12) translateY(-6px);}
    60%{transform:scale(.96);}100%{transform:scale(1);}
  }
  #pet.flip img{transform:scaleX(-1);}
  /* 底部操作按钮 */
  .actions{
    position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 16px);
    display:flex;justify-content:center;gap:12px;z-index:20;
  }
  .btn{
    border:none;background:var(--card);color:var(--text);font-size:14px;
    padding:12px 18px;border-radius:14px;min-height:44px;backdrop-filter:blur(6px);
  }
  .btn.primary{background:var(--accent);color:#2a1c05;font-weight:700;}
  .hint{position:fixed;bottom:80px;left:0;right:0;text-align:center;font-size:12px;color:var(--sub);z-index:15;}
</style>
</head>
<body>

  <div class="panel">
    <div class="title">小橘桌宠 <span>· 原型</span></div>
    <div class="bars">
      <div class="bar">
        <div class="label"><span>心情</span><span id="moodNum">80</span></div>
        <div class="track"><div class="fill" id="moodFill" style="width:80%"></div></div>
      </div>
      <div class="bar">
        <div class="label"><span>饱食</span><span id="foodNum">60</span></div>
        <div class="track"><div class="fill" id="foodFill" style="width:60%"></div></div>
      </div>
    </div>
  </div>

  <div class="bubble" id="bubble"></div>

  <div id="pet">
    <img src="assets/cat.png" alt="桌宠">
  </div>

  <div class="hint">拖动可以把小橘放到任意位置 · 点它摸摸头</div>

  <div class="actions">
    <button class="btn" id="btnFeed">喂食</button>
    <button class="btn primary" id="btnPlay">陪玩</button>
  </div>

<script>
(function(){
  const pet = document.getElementById('pet');
  const bubble = document.getElementById('bubble');
  const moodFill = document.getElementById('moodFill');
  const foodFill = document.getElementById('foodFill');
  const moodNum = document.getElementById('moodNum');
  const foodNum = document.getElementById('foodNum');

  const state = { mood:80, food:60, x:0, y:0, dragging:false, lastX:0, lastY:0 };

  const SAY = {
    touch:['喵呜~','摸摸头好舒服','再摸一下嘛','你好呀'],
    feed:['好吃！','喵~ 谢谢投喂','肚子暖暖的'],
    play:['一起玩！','好开心呀','再来一局'],
    idle:['发呆中……','想出去走走','有点困了']
  };

  function say(arr){
    bubble.textContent = arr[Math.floor(Math.random()*arr.length)];
    bubble.classList.add('show');
    clearTimeout(say._t);
    say._t = setTimeout(()=>bubble.classList.remove('show'),1600);
  }
  function render(){
    state.mood = Math.max(0,Math.min(100,state.mood));
    state.food = Math.max(0,Math.min(100,state.food));
    moodFill.style.width = state.mood+'%';
    foodFill.style.width = state.food+'%';
    moodNum.textContent = Math.round(state.mood);
    foodNum.textContent = Math.round(state.food);
  }
  function place(x,y){
    const w = pet.offsetWidth, h = pet.offsetHeight;
    const maxX = window.innerWidth - w;
    const maxY = window.innerHeight - h;
    state.x = Math.max(0,Math.min(maxX,x));
    state.y = Math.max(0,Math.min(maxY,y));
    pet.style.left = state.x+'px';
    pet.style.top = state.y+'px';
  }

  // 初始居中
  place(window.innerWidth/2 - 60, window.innerHeight*0.55 - 60);

  // 拖拽
  pet.addEventListener('touchstart', e=>{
    state.dragging = true;
    const t = e.touches[0];
    state.lastX = t.clientX - state.x;
    state.lastY = t.clientY - state.y;
    pet.classList.add('dragging');
  },{passive:true});
  pet.addEventListener('touchmove', e=>{
    if(!state.dragging) return;
    const t = e.touches[0];
    place(t.clientX - state.lastX, t.clientY - state.lastY);
  },{passive:true});
  pet.addEventListener('touchend', ()=>{
    state.dragging = false;
    pet.classList.remove('dragging');
  });
  // 鼠标拖拽（桌面预览）
  pet.addEventListener('mousedown', e=>{
    state.dragging = true;
    state.lastX = e.clientX - state.x;
    state.lastY = e.clientY - state.y;
    pet.classList.add('dragging');
  });
  window.addEventListener('mousemove', e=>{
    if(state.dragging) place(e.clientX - state.lastX, e.clientY - state.lastY);
  });
  window.addEventListener('mouseup', ()=>{ state.dragging=false; pet.classList.remove('dragging'); });

  // 点击互动（区分拖拽与点击）
  let moved = false;
  pet.addEventListener('touchstart', ()=>{ moved=false; });
  pet.addEventListener('touchmove', ()=>{ moved=true; });
  pet.addEventListener('click', ()=>{
    if(moved) return;
    pet.classList.remove('bounce'); void pet.offsetWidth; pet.classList.add('bounce');
    state.mood = Math.min(100, state.mood + 4);
    say(SAY.touch); render();
  });

  // 按钮
  document.getElementById('btnFeed').addEventListener('click', ()=>{
    state.food = Math.min(100, state.food + 18);
    state.mood = Math.min(100, state.mood + 3);
    pet.classList.remove('bounce'); void pet.offsetWidth; pet.classList.add('bounce');
    say(SAY.feed); render();
  });
  document.getElementById('btnPlay').addEventListener('click', ()=>{
    state.mood = Math.min(100, state.mood + 15);
    state.food = Math.max(0, state.food - 8);
    pet.classList.remove('bounce'); void pet.offsetWidth; pet.classList.add('bounce');
    say(SAY.play); render();
  });

  // 随机散步：每隔一段时间自己走到随机位置
  function wander(){
    if(!state.dragging){
      const nx = Math.random()*(window.innerWidth - 120);
      const ny = Math.random()*(window.innerHeight - 200);
      pet.classList.toggle('flip', nx < state.x);
      pet.style.transition = 'left 1.6s ease, top 1.6s ease';
      place(nx, ny);
      setTimeout(()=>pet.style.transition='', 1600);
    }
    setTimeout(wander, 4000 + Math.random()*3000);
  }
  setTimeout(wander, 3000);

  // 随时间缓慢消耗
  setInterval(()=>{
    state.food -= 1; state.mood -= 0.5; render();
  }, 5000);

  render();
})();
</script>
</body>
</html>
